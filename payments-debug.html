<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>입금 데이터 진단</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Noto Sans KR", sans-serif; padding: 1.5rem; background: #f9fafb; color: #111827; font-size: 13px; }
    h1 { font-size: 1.2rem; margin-bottom: 1rem; }
    h2 { font-size: 1rem; margin-top: 2rem; margin-bottom: 0.5rem; padding: 0.5rem; background: #1d4ed8; color: white; border-radius: 0.4rem; }
    h2 .total { float: right; font-weight: 600; }
    .debug-box { background: #fef3c7; border: 1px solid #fde68a; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; }
    .debug-box code { background: white; padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-family: monospace; }
    .yearSummary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .ysum { background: white; padding: 1rem; border-radius: 0.5rem; border: 1px solid #e5e7eb; }
    .ysum h3 { font-size: 0.85rem; color: #6b7280; margin-bottom: 0.3rem; font-weight: 500; }
    .ysum .new { font-size: 0.9rem; color: #047857; }
    .ysum .old { font-size: 0.9rem; color: #b45309; }
    .ysum .total { font-size: 1.2rem; font-weight: 800; margin-top: 0.4rem; color: #111827; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 0.5rem; overflow: hidden; }
    th, td { padding: 0.5rem; border-bottom: 1px solid #f3f4f6; text-align: left; font-size: 12px; }
    th { background: #f3f4f6; font-weight: 600; color: #374151; }
    td.right { text-align: right; }
    .src-new { background: #ecfdf5; color: #047857; font-weight: 600; padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 11px; }
    .src-old { background: #fef3c7; color: #b45309; font-weight: 600; padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 11px; }
    pre { background: white; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; overflow: auto; max-height: 400px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>입금 데이터 진단</h1>
  <div class="debug-box" id="debug-info">디버그 정보 로딩 중...</div>
  <div id="content"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.example.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase.js"></script>
  <script src="firestore-service.js"></script>
  <script src="auth-guard.js"></script>
  <script>
    function fmt(n) { return Number(n||0).toLocaleString(); }

    var debugInfo = {
      callbackCalls: 0,
      lastError: null,
      itemsCount: 0,
      sampleItem: null,
      hasFirestoreService: !!window.firestoreService,
      hasSubscribeProjects: !!(window.firestoreService && typeof window.firestoreService.subscribeProjects === 'function'),
      hasFirebaseDb: !!window.__firebaseDb,
      isConfigured: !!window.__firebaseConfigured,
      currentUser: null
    };

    // 현재 인증 사용자
    try {
      if (window.firebase && window.firebase.auth) {
        var u = window.firebase.auth().currentUser;
        if (u) debugInfo.currentUser = u.email || u.uid;
      }
    } catch (e) {}

    function updateDebug() {
      var el = document.getElementById('debug-info');
      el.innerHTML =
        '<strong>🔍 디버그 정보:</strong><br>' +
        '<code>firestoreService 로드:</code> ' + (debugInfo.hasFirestoreService ? '✓ 있음' : '✗ 없음') + '<br>' +
        '<code>subscribeProjects 함수:</code> ' + (debugInfo.hasSubscribeProjects ? '✓ 있음' : '✗ 없음') + '<br>' +
        '<code>__firebaseDb:</code> ' + (debugInfo.hasFirebaseDb ? '✓ 있음' : '✗ 없음') + '<br>' +
        '<code>__firebaseConfigured:</code> ' + (debugInfo.isConfigured ? '✓ true' : '✗ false/없음') + '<br>' +
        '<code>인증 사용자:</code> ' + (debugInfo.currentUser || '✗ 없음') + '<br>' +
        '<code>콜백 호출 횟수:</code> ' + debugInfo.callbackCalls + '<br>' +
        '<code>받은 items 개수:</code> ' + debugInfo.itemsCount + '<br>' +
        (debugInfo.lastError ? '<code style="color:#b91c1c">에러:</code> ' + debugInfo.lastError + '<br>' : '') +
        (debugInfo.sampleItem ? '<details><summary>첫 과제 raw 데이터 (클릭)</summary><pre>' + JSON.stringify(debugInfo.sampleItem, null, 2) + '</pre></details>' : '');
    }

    function analyze(items) {
      var years = ['2023', '2024', '2025', '2026'];
      var byYear = {};
      years.forEach(function (y) { byYear[y] = { rows: [], newTotal: 0, oldTotal: 0 }; });

      (items || []).forEach(function (it) {
        (it.yearBudgets || []).forEach(function (yb, idx) {
          var newP = yb.actualPayments || [];
          var oldP = (yb.payments || []).filter(function (p) { return p.actualAmount; });

          newP.forEach(function (p) {
            var y = (p.date || '').toString().slice(0, 4);
            if (byYear[y]) {
              byYear[y].rows.push({ k: it.keywords || it.projectName || '(이름없음)', idx: (idx + 1) + '차', src: 'new', date: p.date, amount: Number(p.amount) || 0 });
              byYear[y].newTotal += Number(p.amount) || 0;
            }
          });
          oldP.forEach(function (p) {
            var y = (p.actualDate || '').toString().slice(0, 4);
            if (byYear[y]) {
              byYear[y].rows.push({ k: it.keywords || it.projectName || '(이름없음)', idx: (idx + 1) + '차', src: 'old', date: p.actualDate, amount: Number(p.actualAmount) || 0 });
              byYear[y].oldTotal += Number(p.actualAmount) || 0;
            }
          });
        });
      });

      return byYear;
    }

    function render(byYear) {
      var years = ['2023', '2024', '2025', '2026'];
      var html = '<div class="yearSummary">';
      html += years.map(function (y) {
        var data = byYear[y];
        var total = data.newTotal + data.oldTotal;
        return '<div class="ysum">' +
          '<h3>' + y + '년</h3>' +
          '<div class="new">새 actualPayments: ' + fmt(data.newTotal) + '</div>' +
          '<div class="old">옛 payments: ' + fmt(data.oldTotal) + '</div>' +
          '<div class="total">합계: ' + fmt(total) + '</div>' +
        '</div>';
      }).join('');
      html += '</div>';

      html += years.map(function (y) {
        var data = byYear[y];
        if (!data.rows.length) return '';
        data.rows.sort(function (a, b) { if (a.k !== b.k) return a.k < b.k ? -1 : 1; return a.date < b.date ? -1 : 1; });
        var rowsHtml = data.rows.map(function (r) {
          return '<tr>' +
            '<td>' + r.k + ' <span style="color:#9ca3af">' + r.idx + '</span></td>' +
            '<td><span class="src-' + r.src + '">' + (r.src === 'new' ? '새' : '옛') + '</span></td>' +
            '<td>' + r.date + '</td>' +
            '<td class="right">' + fmt(r.amount) + '</td>' +
          '</tr>';
        }).join('');
        var total = data.newTotal + data.oldTotal;
        return '<h2>' + y + '년 입금 내역 <span class="total">합계: ' + fmt(total) + '원</span></h2>' +
          '<table>' +
            '<thead><tr><th>과제 (차수)</th><th>출처</th><th>날짜</th><th class="right">금액</th></tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
          '</table>';
      }).join('');

      document.getElementById('content').innerHTML = html;
    }

    updateDebug();

    try {
      var svc = window.firestoreService;
      if (svc && typeof svc.subscribeProjects === 'function') {
        svc.subscribeProjects(function (items) {
          debugInfo.callbackCalls += 1;
          debugInfo.itemsCount = (items || []).length;
          debugInfo.sampleItem = (items || [])[0] || null;
          updateDebug();
          render(analyze(items));
        });
      } else {
        debugInfo.lastError = 'firestoreService.subscribeProjects 함수가 없습니다.';
        updateDebug();
      }
    } catch (err) {
      debugInfo.lastError = err.message;
      updateDebug();
    }

    // 5초 후 콜백이 한 번도 안 호출됐으면 알림
    setTimeout(function () {
      if (debugInfo.callbackCalls === 0) {
        debugInfo.lastError = (debugInfo.lastError || '') + ' / 5초 내 콜백 호출 0회 — Firestore 권한 또는 인증 확인 필요';
        updateDebug();
      }
    }, 5000);
  </script>
</body>
</html>

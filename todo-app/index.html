<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매일 할 일 - Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>매일 할 일</h1>
    </header>

    <section class="input-section">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요" maxlength="100" autocomplete="off">
      <button type="button" id="add-btn">추가</button>
    </section>

    <section class="list-section">
      <h2 class="list-title">예정</h2>
      <ul id="pending-list"></ul>
    </section>

    <section class="list-section">
      <h2 class="list-title">완료</h2>
      <ul id="done-list"></ul>
    </section>

    <footer>
      <span id="count-text">예정 0개 · 완료 0개</span>
    </footer>
  </div>

  <script src="todo.js"></script>
</body>
</html>

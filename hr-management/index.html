<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[R&DM] 인력 정보</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="header-title">[R&DM] 인력 정보</h1>
    </header>

    <!-- 상단 3분할 레이아웃 (Top Section) -->
    <section class="top-section">
      <div class="top-grid">
        <!-- 왼쪽: Status & Company -->
        <div class="top-col top-col-left">
          <h2 class="section-title">인원 현황 👤</h2>
          <div class="btn-row btn-row-center" role="group" aria-label="재직 상태 필터">
            <button type="button" class="ui-btn ui-btn--ghost status-card active" data-status="전체" id="status-all">전체 <span class="filter-count" id="count-all">0</span></button>
            <button type="button" class="ui-btn ui-btn--ghost status-card" data-status="재직" id="status-employed">재직 <span class="filter-count" id="count-employed">0</span></button>
            <button type="button" class="ui-btn ui-btn--ghost status-card" data-status="퇴직" id="status-retired">퇴직 <span class="filter-count" id="count-retired">0</span></button>
          </div>
          <div class="btn-row btn-row-center company-sub-buttons visible" id="company-sub-buttons" aria-hidden="false" role="group" aria-label="회사 필터">
            <button type="button" class="ui-btn ui-btn--ghost company-btn" data-company="식스티">식스티 <span class="filter-count" id="count-company-식스티">0</span></button>
            <button type="button" class="ui-btn ui-btn--ghost company-btn" data-company="굿뉴스">굿뉴스 <span class="filter-count" id="count-company-굿뉴스">0</span></button>
            <button type="button" class="ui-btn ui-btn--ghost company-btn" data-company="패리티">패리티 <span class="filter-count" id="count-company-패리티">0</span></button>
          </div>
          <div class="dual-row">
            <button type="button" id="dual-btn" class="ui-btn ui-btn--ghost dual-btn">
              <span class="dual-main">겸직 <span class="filter-count" id="count-dual">0</span></span>
              <span class="dual-sub">* 총 인원에 포함되지 않음</span>
            </button>
          </div>
          <p class="section-footnote">* 건강보험 가입자명부 기준</p>
        </div>

        <!-- 중앙: Entry/Exit Stats -->
        <div class="top-col top-col-center">
          <h2 class="section-title">입 · 퇴사 현황 📊</h2>
          <div class="stats-meta" aria-label="오늘 날짜 및 요약">
            <span class="today-date" id="today-date">-</span>
          </div>
          <div class="stats-big stats-big--year" aria-label="올해 누적 입사/퇴사">
            <div class="stats-big-item">
              <span class="stats-big-value stats-big-value--year" id="stats-joined-year">0</span>
              <span class="stats-big-unit">입사</span>
            </div>
            <div class="stats-big-item">
              <span class="stats-big-value stats-big-value--year" id="stats-left-year">0</span>
              <span class="stats-big-unit">퇴사</span>
            </div>
          </div>
          <div class="stats-divider" aria-hidden="true"></div>

          <div class="period-query" aria-label="기간별 조회">
            <div class="period-query-head">
              <h3 class="subsection-title">기간별 조회</h3>
              <span class="period-query-hint" id="period-query-hint">조회 결과</span>
            </div>

            <div class="period-query-body">
              <div class="stats-controls" aria-label="기간 선택">
                <div class="field">
                  <label for="stats-year" class="stats-label">연도</label>
                  <select id="stats-year" class="ui-select stats-year-select" aria-label="연도 선택"></select>
                </div>
                <div class="field">
                  <label for="stats-month" class="stats-label">월</label>
                  <select id="stats-month" class="ui-select stats-month-select" aria-label="월 선택">
                    <option value="">전체</option>
                  </select>
                </div>
              </div>

              <div class="stats-big stats-big--query" aria-label="기간별 조회 입사/퇴사">
                <div class="stats-big-item">
                  <span class="stats-big-value stats-big-value--query" id="stats-joined">0</span>
                  <span class="stats-big-unit">입사</span>
                </div>
                <div class="stats-big-item">
                  <span class="stats-big-value stats-big-value--query" id="stats-left">0</span>
                  <span class="stats-big-unit">퇴사</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 오른쪽: Point-in-Time Query (월말 재직 인원) -->
        <div class="top-col top-col-right">
          <h2 class="section-title">월말 기준 재직 인원 조회 📅</h2>
          <div class="point-in-time-controls">
            <label for="pity-year">연도</label>
            <select id="pity-year" class="ui-select ui-select--lg"></select>
            <label for="pity-month">월</label>
            <select id="pity-month" class="ui-select ui-select--lg"></select>
            <button type="button" id="pity-query-btn" class="ui-btn ui-btn--primary ui-btn--lg pity-query-btn">조회</button>
            <button type="button" id="pity-clear-btn" class="ui-btn ui-btn--ghost ui-btn--lg pity-clear-btn" title="조회 결과 지우기">지우기</button>
          </div>
          <div class="pity-summary-card" id="pity-summary-card" hidden>
            <p class="pity-summary-text" id="pity-summary-text"></p>
          </div>
          <p class="section-footnote">* 4대보험 가입자명부 기준</p>
        </div>
      </div>
    </section>

    <div class="toolbar">
      <div class="search-section">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="성명, 소속, 회사로 검색..."
          autocomplete="off"
        >
        <button type="button" id="search-btn" class="search-btn">검색</button>
      </div>
      <div class="toolbar-actions">
        <button type="button" id="delete-all-btn" class="danger-btn">전체 삭제(임시)</button>
        <button type="button" id="add-btn" class="add-btn">신규 인력 등록</button>
        <input type="file" id="legacy-excel-input" accept=".xlsx,.xls" hidden>
        <button type="button" id="legacy-excel-btn" class="legacy-excel-btn">기존 엑셀 업로드</button>
        <input type="file" id="excel-input" accept=".xlsx,.xls" hidden>
        <button type="button" id="excel-upload-btn" class="excel-upload-btn icon-only" title="엑셀 업로드" aria-label="엑셀 업로드">
          <svg class="excel-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
        </button>
      </div>
    </div>

    <div class="bottom-section">
      <div class="table-wrap">
        <div class="table-container">
          <table class="data-table" id="hr-table">
            <thead>
              <tr>
                <th>No</th>
                <th>구분</th>
                <th id="th-name" class="sortable">성명</th>
                <th>소속</th>
                <th>생년월일</th>
                <th>성별</th>
                <th>자격취득일</th>
                <th>자격상실일</th>
                <th>연구자번호</th>
                <th>최종학위</th>
                <th>학과</th>
                <th>비고</th>
                <th>상세</th>
                <th>수정/삭제</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- 데이터가 동적으로 추가됩니다 -->
            </tbody>
          </table>
        </div>
      </div>
      <aside class="detail-sidebar" id="detail-sidebar" aria-hidden="true">
        <div class="detail-sidebar-inner">
          <div class="detail-sidebar-header">
            <h3>상세 정보</h3>
            <button type="button" class="detail-sidebar-close" id="detail-sidebar-close" aria-label="닫기">&times;</button>
          </div>
          <div class="detail-sidebar-body" id="detail-sidebar-body">
            <!-- 행 클릭 시 동적 채움 -->
          </div>
        </div>
      </aside>
    </div>

    <div class="stats-bar">
      <span class="stat-item">총 인력: <strong id="total-count">0</strong>명</span>
      <span class="stat-item">활성 인력: <strong id="active-count">0</strong>명</span>
    </div>
  </div>

  <!-- 신규 등록/수정 모달 -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">신규 인력 등록</h2>
        <button type="button" class="close-btn" id="close-modal">&times;</button>
      </div>
      <form id="hr-form" class="modal-form">
        <div class="form-row">
          <div class="form-group">
            <label for="division">회사 *</label>
            <select id="division" name="division" required>
              <option value="">선택하세요</option>
              <option value="식스티">식스티</option>
              <option value="굿뉴스">굿뉴스</option>
              <option value="패리티">패리티</option>
            </select>
          </div>
          <div class="form-group">
            <label for="name">성명 *</label>
            <input type="text" id="name" name="name" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="department">소속</label>
            <select id="department" name="department">
              <option value="">선택하세요</option>
              <option value="CI">CI</option>
              <option value="TVPP">TVPP</option>
              <option value="CVPP">CVPP</option>
              <option value="IPP">IPP</option>
              <option value="CEO Office">CEO Office</option>
            </select>
          </div>
          <div class="form-group">
            <label for="birthdate">생년월일 *</label>
            <div class="date-inputs" aria-label="생년월일">
              <input id="birthdate-y" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="YYYY" aria-label="생년(4자리)" required>
              <span class="date-sep">-</span>
              <input id="birthdate-m" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" aria-label="월(2자리)" required>
              <span class="date-sep">-</span>
              <input id="birthdate-d" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="DD" aria-label="일(2자리)" required>
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="ssn">주민등록번호 *</label>
            <input type="text" id="ssn" name="ssn" placeholder="000000-0000000" maxlength="14" required>
          </div>
          <div class="form-group">
            <label for="gender">성별</label>
            <input type="text" id="gender" name="gender" placeholder="주민등록번호로 자동 설정" readonly>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="acquisition-date">자격취득일 *</label>
            <div class="date-inputs" aria-label="자격취득일">
              <input id="acquisition-y" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="YYYY" aria-label="자격취득년(4자리)" required>
              <span class="date-sep">-</span>
              <input id="acquisition-m" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" aria-label="자격취득월(2자리)" required>
              <span class="date-sep">-</span>
              <input id="acquisition-d" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="DD" aria-label="자격취득일(2자리)" required>
            </div>
          </div>
          <div class="form-group">
            <label for="loss-date">자격상실일</label>
            <div class="date-inputs" aria-label="자격상실일">
              <input id="loss-y" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="YYYY" aria-label="자격상실년(4자리)">
              <span class="date-sep">-</span>
              <input id="loss-m" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="MM" aria-label="자격상실월(2자리)">
              <span class="date-sep">-</span>
              <input id="loss-d" class="date-part" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="DD" aria-label="자격상실일(2자리)">
            </div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="phone-number">핸드폰번호</label>
            <input type="text" id="phone-number" name="phone-number" placeholder="010-0000-0000">
          </div>
          <div class="form-group">
            <label for="researcher-id">연구자번호</label>
            <input type="text" id="researcher-id" name="researcher-id" placeholder="연구자 번호">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="address">주소</label>
            <input type="text" id="address" name="address" placeholder="주소">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="final-degree">최종학위</label>
            <input type="text" id="final-degree" name="final-degree" placeholder="예: 석사, 박사">
          </div>
          <div class="form-group">
            <label for="school">학교</label>
            <input type="text" id="school" name="school" placeholder="학교명">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="major">학과</label>
            <input type="text" id="major" name="major" placeholder="학과명">
          </div>
          <div class="form-group">
            <label for="degree-no">학위번호</label>
            <input type="text" id="degree-no" name="degree-no" placeholder="학위번호">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="degree-award-date">학위 수여일</label>
            <input type="text" id="degree-award-date" name="degree-award-date" placeholder="YYYY-MM-DD">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="remark">비고</label>
            <textarea id="remark" name="remark" rows="2" placeholder="예: 겸직, 특이사항 메모 등"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="cancel-btn" id="cancel-btn">취소</button>
          <button type="submit" class="submit-btn">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

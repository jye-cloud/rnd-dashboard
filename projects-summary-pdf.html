<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[R&DM] 과제별 상세 — 전체 PDF</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html:not(.auth-bypass) body { visibility: hidden !important; }
    html.auth-bypass body { visibility: visible; }

    body {
      background: #f9fafb;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: #1e293b;
    }

    .pdf-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .pdf-toolbar {
      position: sticky;
      top: 0;
      background: #ffffff;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      z-index: 100;
      margin-bottom: 2rem;
    }
    .pdf-toolbar-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1e293b;
      margin: 0;
    }
    .pdf-toolbar-actions {
      display: flex;
      gap: 0.5rem;
    }
    .pdf-btn {
      padding: 0.55rem 1rem;
      border-radius: 0.45rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #475569;
    }
    .pdf-btn:hover { background: #f8fafc; }
    .pdf-btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    .pdf-btn-primary:hover { background: #1d4ed8; }

    /* 표지 */
    .pdf-cover {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #fff;
      border-radius: 1rem;
      padding: 4rem 2rem;
      text-align: center;
      margin-bottom: 2rem;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
    }
    .pdf-cover-title {
      font-size: 2rem;
      font-weight: 800;
      margin: 0 0 0.6rem;
      letter-spacing: -0.02em;
    }
    .pdf-cover-subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.85);
      margin: 0 0 2rem;
    }
    .pdf-cover-meta {
      display: inline-flex;
      gap: 2rem;
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.15);
      border-radius: 0.6rem;
      backdrop-filter: blur(4px);
    }
    .pdf-cover-meta-item {
      text-align: center;
    }
    .pdf-cover-meta-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fbbf24;
    }
    .pdf-cover-meta-label {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.85);
      margin-top: 0.2rem;
    }

    /* 목차 */
    .pdf-toc {
      background: #fff;
      border-radius: 0.85rem;
      padding: 1.5rem 1.75rem;
      margin-bottom: 2rem;
      border: 1px solid #e5e7eb;
    }
    .pdf-toc-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111827;
      margin: 0 0 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .pdf-toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: toc;
    }
    .pdf-toc-item {
      counter-increment: toc;
      padding: 0.5rem 0;
      border-bottom: 1px dashed #f1f5f9;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }
    .pdf-toc-item:last-child { border-bottom: none; }
    .pdf-toc-item::before {
      content: counter(toc, decimal-leading-zero) ".";
      color: #2563eb;
      font-weight: 700;
      font-size: 0.85rem;
      flex: 0 0 auto;
    }
    .pdf-toc-name {
      flex: 1;
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e293b;
    }
    .pdf-toc-meta {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    /* 개별 과제 페이지 */
    .pdf-project {
      background: #fff;
      border-radius: 0.85rem;
      padding: 0;
      margin-bottom: 2rem;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      page-break-before: always;
    }

    .pdf-project-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #fff;
      padding: 1.5rem 1.75rem;
    }
    .pdf-project-badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }
    .pdf-project-badge {
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .pdf-project-title {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.3;
      margin: 0 0 0.35rem;
    }
    .pdf-project-business {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.85);
      margin: 0;
    }
    .pdf-project-num {
      display: inline-block;
      font-size: 0.72rem;
      background: rgba(0,0,0,0.25);
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 0.04em;
    }

    .pdf-project-body {
      padding: 1.5rem 1.75rem;
    }

    .pdf-period {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.7rem;
      font-size: 0.88rem;
    }
    .pdf-period-label { color: #94a3b8; }
    .pdf-period-value { font-weight: 700; color: #1e293b; }
    .pdf-period-duration { color: #64748b; }

    .pdf-progress {
      height: 6px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }
    .pdf-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
    }
    .pdf-progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }
    .pdf-progress-text strong {
      color: #2563eb;
      font-weight: 700;
    }

    /* 정보 그리드 */
    .pdf-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .pdf-info-card {
      background: #f8fafc;
      border-radius: 0.5rem;
      padding: 0.85rem 1rem;
      border: 1px solid #e5e7eb;
    }
    .pdf-info-card-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      margin: 0 0 0.5rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .pdf-info-list {
      margin: 0;
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 0.35rem 0.6rem;
    }
    .pdf-info-list dt {
      color: #94a3b8;
      font-size: 0.78rem;
    }
    .pdf-info-list dd {
      margin: 0;
      color: #1e293b;
      font-size: 0.82rem;
      font-weight: 500;
      word-break: break-all;
    }

    /* 사업비 표 */
    .pdf-money-section {
      margin-bottom: 1.25rem;
    }
    .pdf-section-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #111827;
      margin: 0 0 0.6rem;
    }
    .pdf-money-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .pdf-money-table thead th {
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
      text-align: center;
      padding: 0.5rem 0.4rem;
      border: 1px solid #e5e7eb;
      font-size: 0.72rem;
    }
    .pdf-money-table tbody td {
      text-align: center;
      padding: 0.45rem 0.4rem;
      border: 1px solid #e5e7eb;
    }
    .pdf-money-table tbody td.label {
      background: #fef3c7;
      color: #92400e;
      font-weight: 600;
      text-align: left;
      padding-left: 0.7rem;
    }
    .pdf-money-table tbody td.amount {
      text-align: right;
      padding-right: 0.7rem;
      font-variant-numeric: tabular-nums;
    }
    .pdf-money-table tbody tr.total td {
      background: #eff6ff;
      font-weight: 700;
      color: #1e40af;
    }

    /* 마일스톤 */
    .pdf-milestones {
      margin-top: 1.25rem;
    }
    .pdf-ms-list {
      position: relative;
      padding-left: 1.25rem;
    }
    .pdf-ms-list::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: #fbbf24;
    }
    .pdf-ms-item {
      position: relative;
      padding: 0.3rem 0 0.65rem 0.8rem;
    }
    .pdf-ms-item:last-child { padding-bottom: 0; }
    .pdf-ms-item::before {
      content: '';
      position: absolute;
      left: -1.25rem;
      top: 0.55rem;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fbbf24;
      border: 2px solid #fef3c7;
    }
    .pdf-ms-item.done::before { background: #10b981; border-color: #d1fae5; }
    .pdf-ms-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .pdf-ms-date {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
      min-width: 90px;
      font-variant-numeric: tabular-nums;
    }
    .pdf-ms-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1e293b;
    }
    .pdf-ms-item.done .pdf-ms-name {
      color: #94a3b8;
      text-decoration: line-through;
    }
    .pdf-ms-meta {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 0.15rem;
    }

    .pdf-loading {
      text-align: center;
      padding: 4rem 1rem;
      color: #94a3b8;
    }

    /* ===== 인쇄 전용 ===== */
    @media print {
      body { background: #fff !important; }
      .pdf-toolbar { display: none !important; }
      .pdf-wrap { max-width: 100%; padding: 0; margin: 0; }
      .pdf-cover, .pdf-toc, .pdf-project {
        box-shadow: none !important;
      }
      .pdf-cover, .pdf-project-header {
        background: #1e3a8a !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .pdf-money-table thead th,
      .pdf-money-table tbody td.label,
      .pdf-money-table tbody tr.total td,
      .pdf-info-card,
      .pdf-cover-meta {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .pdf-project {
        page-break-before: always;
        page-break-inside: avoid;
        margin-bottom: 0;
        border: none;
        border-radius: 0;
      }
      .pdf-cover, .pdf-toc {
        page-break-after: always;
      }
    }
  </style>
</head>
<body>

  <div class="pdf-toolbar">
    <h1 class="pdf-toolbar-title">📑 과제별 상세 — 전체 PDF</h1>
    <div class="pdf-toolbar-actions">
      <button type="button" class="pdf-btn" onclick="window.close()">✕ 닫기</button>
      <button type="button" class="pdf-btn pdf-btn-primary" id="pdf-print-btn">📥 PDF 저장 / 인쇄</button>
    </div>
  </div>

  <div class="pdf-wrap">
    <div id="pdf-content">
      <div class="pdf-loading">불러오는 중…</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.example.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase.js"></script>
  <script src="auth-guard.js"></script>
  <script src="firestore-service.js"></script>
  <script src="projects-summary-pdf.js"></script>
</body>
</html>

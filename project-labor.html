<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[R&DM] 프로젝트별 인건비</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sidebar.css">
  <style>
    /* ========== 인증 게이트 (auth-guard.js 와 함께 동작) ========== */
    html:not(.auth-bypass) .dashboard { visibility: hidden !important; }
    html.auth-bypass .dashboard { visibility: visible; }
    .auth-overlay {
      position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
      width: 100% !important; height: 100% !important; z-index: 2147483647 !important;
      display: flex !important; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #e0f2fe 100%);
      visibility: visible !important; opacity: 1 !important;
    }
    html.auth-bypass .auth-overlay { display: none !important; }
    .auth-modal {
      width: 90%; max-width: 400px; background: #fff; border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgb(15 23 42 / 0.25); padding: 2rem; text-align: center;
    }
    .auth-modal-logo { font-size: 1.5rem; font-weight: 700; color: #2563eb; margin-bottom: 0.5rem; }
    .auth-modal-title { font-size: 1rem; color: #64748b; margin-bottom: 1.5rem; line-height: 1.5; }
    .auth-modal .auth-error { margin-top: 0.75rem; font-size: 0.875rem; color: #ef4444; display: none; }
    .auth-modal .auth-error.visible { display: block; }
    body { display: none !important; }
    body.body-ready { display: block !important; }
    /* ========== 인증 게이트 끝 ========== */

    /* ========== 레이아웃 ========== */
    /* .container는 style.css의 전역 룰을 사용 */

    /* ========== 컨트롤바 (history-toolbar 패턴 동일) ========== */
    .history-toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .history-toolbar-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .history-toolbar select,
    .history-toolbar input[type="number"] {
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .history-toolbar select:focus,
    .history-toolbar input[type="number"]:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .history-toolbar select { min-width: 200px; }
    .history-toolbar input[type="number"] { width: 76px; }

    /* 분기 네비게이터 */
    .pl-quarter-nav {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      overflow: hidden;
      background: var(--card-bg);
    }
    .pl-quarter-btn {
      padding: 0.5rem 0.65rem;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.85rem;
      transition: background 0.15s;
      line-height: 1;
      font-family: inherit;
    }
    .pl-quarter-btn:hover { background: #f1f5f9; color: var(--text-primary); }
    .pl-quarter-label {
      padding: 0.5rem 0.85rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 56px;
      text-align: center;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    /* 오른쪽 액션 버튼 영역 */
    .projects-actions-spacer { flex: 1; }
    .projects-actions-buttons { display: flex; gap: 0.5rem; align-items: center; }

    /* ui-btn은 style.css에 있으나 혹시 없을 때 대비 */
    .ui-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-secondary);
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .ui-btn:hover { background: #f1f5f9; border-color: #cbd5e1; color: var(--text-primary); }
    .ui-btn--primary { background: var(--primary-color, #2563eb); border-color: var(--primary-color, #2563eb); color: #fff; }
    .ui-btn--primary:hover { background: #1d4ed8; color: #fff; }
    .ui-btn--success { background: #059669; border-color: #059669; color: #fff; }
    .ui-btn--success:hover { background: #047857; color: #fff; }

    /* ========== 신규 채용 진척 배너 ========== */
    .pl-hire-banner {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #dbeafe;
      border: 1px solid #bfdbfe;
      border-radius: 0.75rem;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #1e40af;
    }
    .pl-hire-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .pl-hire-badge--done     { background: #dcfce7; color: #166534; }
    .pl-hire-badge--progress { background: #fef9c3; color: #854d0e; }

    /* ========== 탭 (기존 history-tab 카드 스타일과 동일) ========== */
    .history-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .history-tab {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 1rem 1.25rem;
      background: var(--card-bg, #fff);
      border: 1.5px solid #e5e7eb;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
      font-family: inherit;
    }
    .history-tab:hover { border-color: #cbd5e1; background: #f9fafb; }
    .history-tab.is-active {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border-color: #2563eb;
      border-width: 2px;
      padding: calc(1rem - 0.5px) calc(1.25rem - 0.5px);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15);
    }
    .history-tab-icon { font-size: 1.6rem; line-height: 1; flex-shrink: 0; }
    .history-tab-body { display: flex; flex-direction: column; gap: 0.15rem; flex: 1; }
    .history-tab-title { font-size: 1rem; font-weight: 700; color: #1e293b; }
    .history-tab.is-active .history-tab-title { color: #1d4ed8; }
    .history-tab-sub { font-size: 0.78rem; color: #64748b; }
    .history-tab-count {
      font-size: 0.95rem; font-weight: 700; color: #64748b;
      background: #f1f5f9; padding: 0.25rem 0.65rem;
      border-radius: 999px; flex-shrink: 0;
    }
    .history-tab.is-active .history-tab-count { background: #2563eb; color: #fff; }

    /* ========== 탭 콘텐츠 ========== */
    .pl-tab-content { display: none; }
    .pl-tab-content.is-active { display: block; }

    /* 비교 탭 옵션 행 */
    .pl-compare-options {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .history-toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      background: linear-gradient(135deg, #ecfeff 0%, #cffafe 100%);
      border: 1px solid #67e8f9;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      color: #0e7490;
      user-select: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .history-toggle-chip:hover { border-color: #22d3ee; }
    .history-toggle-chip.is-active {
      background: linear-gradient(135deg, #cffafe 0%, #a5f3fc 100%);
      border-color: #0891b2; color: #155e75; font-weight: 600;
    }
    .history-toggle-chip input { cursor: pointer; accent-color: #0891b2; margin: 0; }

    /* ========== 테이블 래퍼 ========== */
    .pl-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-color, #e5e7eb);
      border-radius: 0.75rem;
      box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.04));
      background: var(--card-bg, #fff);
    }

    /* ========== 메인 테이블 ========== */
    .pl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      table-layout: fixed;
    }
    .pl-table colgroup col.col-name   { width: 115px; }
    .pl-table colgroup col.col-salary { width: 82px; }
    .pl-table colgroup col.col-rate   { width: 60px; }
    .pl-table colgroup col.col-cash   { width: 78px; }
    .pl-table colgroup col.col-inkind { width: 60px; }

    /* 월 헤더 행 — 회색 톤 통일 */
    .pl-table thead tr.pl-thead-month th {
      background: #f1f5f9;
      color: #475569;
      text-align: center;
      padding: 0.6rem 0.5rem 0.35rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      white-space: nowrap;
    }
    /* 인력/월급 고정 헤더 — 같은 폰트 크기, 중앙정렬 */
    .pl-table thead tr.pl-thead-month th.th-fixed {
      background: #e8edf2;
      color: #374151;
      font-size: 0.8rem;
      text-align: center;
      padding-left: 0.5rem;
      border-right: 2px solid #d1d9e0;
    }
    /* 월별 헤더 — 고정과 동일 회색 */
    .pl-table thead tr.pl-thead-month th.th-month {
      background: #f1f5f9;
    }
    .pl-table thead tr.pl-thead-month th.month-sep { border-right: 2px solid #d1d9e0 !important; }

    /* 월 헤더 체크박스 */
    .pl-month-meta {
      display: flex; align-items: center; justify-content: center;
      gap: 0.5rem; margin-top: 0.3rem;
    }
    .pl-month-meta label {
      display: inline-flex; align-items: center; gap: 0.2rem;
      font-size: 0.63rem; color: #94a3b8; cursor: pointer; white-space: nowrap;
    }
    .pl-month-meta input[type="checkbox"] { width: 11px; height: 11px; accent-color: #64748b; cursor: pointer; }

    /* 서브 헤더 행 (참여율/현금/현물) */
    .pl-table thead tr.pl-thead-sub th {
      background: #f8fafc;
      color: #64748b;
      text-align: center;
      padding: 0.35rem 0.3rem;
      font-size: 0.72rem;
      font-weight: 600;
      border-right: 1px solid #e5e7eb;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }
    .pl-table thead tr.pl-thead-sub th.th-fixed {
      background: #f1f5f9;
      color: #374151;
      font-weight: 700;
      border-right: 2px solid #d1d9e0;
    }
    .pl-table thead tr.pl-thead-sub th.month-sep { border-right: 2px solid #d1d9e0; }

    /* tbody 셀 기본 */
    .pl-table tbody td {
      border-bottom: 1px solid #f1f5f9;
      border-right: 1px solid #f1f5f9;
      padding: 0;
      vertical-align: middle;
    }
    .pl-table tbody tr:last-child td { border-bottom: none; }
    .pl-table tbody td.month-sep { border-right: 2px solid #e8eef5; }

    /* 고정 컬럼 (이름/월급) */
    .pl-table tbody td.td-fixed {
      padding: 0.55rem 0.85rem;
      background: #fafafa;
      border-right: 2px solid #e2e8f0;
    }
    .pl-td-name { font-weight: 600; color: var(--text-primary, #1e293b); font-size: 0.85rem; }
    /* 이름 + 뱃지 인라인 한 줄 */
    .pl-name-row {
      display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
      padding: 0.1rem 0;
    }
    .pl-name-text { white-space: nowrap; }
    .pl-name-badges-inline { display: flex; gap: 0.25rem; flex-wrap: wrap; }
    /* 구형 호환 (비교탭 등) */
    .pl-name-badges { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-top: 0.2rem; }
    .pl-badge {
      font-size: 0.62rem; padding: 0.1rem 0.35rem;
      border-radius: 999px; font-weight: 600;
    }
    .pl-badge--youth { background: #ede9fe; color: #5b21b6; }
    .pl-badge--new   { background: #dbeafe; color: #1e40af; }
    .pl-badge--exit  { background: #fee2e2; color: #991b1b; }
    .pl-td-salary {
      font-size: 0.78rem; color: var(--text-secondary, #64748b);
      text-align: right; font-variant-numeric: tabular-nums;
    }

    /* 입력 셀 */
    .pl-cell-input {
      width: 100%; height: 100%; border: none; background: transparent;
      text-align: right; font-size: 0.82rem; font-family: inherit;
      color: var(--text-primary, #1e293b);
      padding: 0.55rem 0.5rem;
      font-variant-numeric: tabular-nums;
      transition: background 0.1s;
    }
    .pl-cell-input:focus { outline: none; background: #eff6ff; }
    .pl-cell-input:hover:not(:focus) { background: #f8fafc; }
    .pl-cell-input[readonly] { color: var(--text-secondary, #64748b); cursor: default; }
    .pl-cell-input[readonly]:hover { background: transparent; }

    /* 참여율 색상 */
    .pl-cell-input.rate-safe   { color: #166534; }
    .pl-cell-input.rate-warn   { color: #854d0e; background: #fefce8; }
    .pl-cell-input.rate-danger { color: #991b1b; background: #fef2f2; font-weight: 700; }

    /* 퇴사자 행 */
    .pl-row--exited td { opacity: 0.42; }
    .pl-row--exited td.td-fixed { opacity: 1; }
    .pl-row--exited .pl-cell-input { background: #f8fafc; cursor: not-allowed; }

    /* 비활성 셀 */
    .pl-cell--inactive .pl-cell-input { background: #f8fafc; cursor: not-allowed; color: #cbd5e1; }

    /* 메모 (빨간 글씨) */
    .pl-memo-text {
      font-size: 0.68rem; color: #dc2626; font-weight: 500;
      padding: 0 0.4rem 0.2rem; display: block; line-height: 1.3;
    }

    /* 합계 행 */
    .pl-table tfoot tr.pl-tfoot-sum td {
      background: #f1f5f9;
      border-top: 2px solid #d1d9e0;
      padding: 0.6rem 0.65rem;
      font-size: 0.8rem; font-weight: 700;
      color: #374151; text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .pl-table tfoot tr.pl-tfoot-sum td.td-fixed {
      background: #e8edf2; text-align: center;
      color: #1f2937; border-right: 2px solid #d1d9e0;
    }
    .pl-table tfoot tr.pl-tfoot-sum td.month-sep { border-right: 2px solid #d1d9e0; }

    /* + 인력 추가 행 */
    .pl-row-add td { padding: 0.5rem 0.65rem; border-top: 1px dashed #e2e8f0; }
    .pl-add-person-btn {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: transparent; border: 1px dashed #cbd5e1;
      border-radius: 0.4rem; padding: 0.35rem 0.75rem;
      font-size: 0.8rem; color: var(--text-secondary, #64748b);
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .pl-add-person-btn:hover { border-color: var(--primary-color, #2563eb); color: var(--primary-color, #2563eb); background: #eff6ff; }

    /* ========== 비교 탭 ========== */
    .pl-table tr.pl-row-planned td { background: #fafafa; }
    .pl-table tr.pl-row-actual  td { background: #fff; }
    .pl-table tr.pl-row-diff    td { background: #fffbeb; font-weight: 600; }
    .pl-table tr.pl-row-diff td.diff-pos  { color: #166534; }
    .pl-table tr.pl-row-diff td.diff-neg  { color: #991b1b; }
    .pl-table tr.pl-row-diff td.diff-zero { color: #94a3b8; }

    /* 행 구분 라벨 (예상/실제/차이) */
    .pl-row-type-label {
      display: inline-block; font-size: 0.65rem; font-weight: 600;
      padding: 0.1rem 0.35rem; border-radius: 0.2rem; margin-left: 0.3rem; vertical-align: middle;
    }
    .pl-row-type-label--planned { background: #e2e8f0; color: #475569; }
    .pl-row-type-label--actual  { background: #dcfce7; color: #166534; }
    .pl-row-type-label--diff    { background: #fef9c3; color: #854d0e; }

    /* 빈 상태 */
    .pl-empty {
      text-align: center; padding: 3rem 1rem;
      color: var(--text-secondary, #94a3b8); font-size: 0.9rem;
    }

    /* ========== 인력 추가 모달 ========== */
    .pl-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 1rem;
    }
    .pl-modal-overlay[hidden] { display: none !important; }
    .pl-modal-panel {
      background: #fff; border-radius: 0.75rem;
      width: 100%; max-width: 440px; max-height: 85vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden;
    }
    .pl-modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-color);
    }
    .pl-modal-title { font-size: 1.05rem; font-weight: 700; margin: 0; color: var(--text-primary); }
    .pl-modal-close {
      background: transparent; border: none; font-size: 1.5rem; line-height: 1;
      color: var(--text-secondary); cursor: pointer; padding: 0.25rem 0.5rem; border-radius: 0.35rem;
    }
    .pl-modal-close:hover { background: #f1f5f9; color: var(--text-primary); }
    .pl-modal-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
    .pl-modal-desc { font-size: 0.85rem; color: var(--text-secondary); margin: 0 0 1rem; }
    .pl-modal-section-title {
      font-size: 0.75rem; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.5rem;
    }
    .pl-modal-footer {
      display: flex; justify-content: flex-end; gap: 0.5rem;
      padding: 0.85rem 1.25rem; border-top: 1px solid var(--border-color); background: #f9fafb;
    }
    .pl-modal-search-wrap { position: relative; margin-bottom: 1rem; }
    .pl-modal-search-icon {
      position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%);
      color: var(--text-secondary); pointer-events: none; font-size: 0.9rem;
    }
    .pl-modal-search-input {
      width: 100%; padding: 0.55rem 2.2rem; border: 1px solid var(--border-color);
      border-radius: 0.5rem; font-size: 0.9rem; font-family: inherit; box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .pl-modal-search-input:focus {
      outline: none; border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }
    .pl-modal-search-clear {
      position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; font-size: 1.1rem; color: var(--text-secondary);
      cursor: pointer; padding: 0.2rem 0.4rem; border-radius: 0.3rem; display: none;
    }
    .pl-modal-search-clear:hover { background: #f1f5f9; }
    .pl-modal-result-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .pl-modal-person-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.85rem; border: 1px solid var(--border-color);
      border-radius: 0.5rem; background: #fff; transition: all 0.15s;
    }
    .pl-modal-person-row:hover { border-color: var(--primary-color); background: #eff6ff; }
    .pl-modal-person-name { font-weight: 600; font-size: 0.9rem; color: var(--text-primary); flex: 1; }
    .pl-modal-person-meta { font-size: 0.75rem; color: var(--text-secondary); }
    .pl-modal-person-salary { font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; }
    .pl-modal-add-btn {
      padding: 0.3rem 0.7rem; border-radius: 0.35rem; font-size: 0.78rem; font-weight: 600;
      font-family: inherit; cursor: pointer; border: 1px solid #2563eb;
      background: #eff6ff; color: #2563eb; transition: all 0.15s; white-space: nowrap;
    }
    .pl-modal-add-btn:hover { background: #2563eb; color: #fff; }
    .pl-modal-remove-btn {
      padding: 0.3rem 0.7rem; border-radius: 0.35rem; font-size: 0.78rem; font-weight: 600;
      font-family: inherit; cursor: pointer; border: 1px solid #e2e8f0;
      background: #f8fafc; color: #64748b; transition: all 0.15s; white-space: nowrap;
    }
    .pl-modal-remove-btn:hover { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
    .pl-modal-empty {
      text-align: center; padding: 2rem 1rem;
      color: var(--text-secondary); font-size: 0.88rem;
    }

    /* 사이드바 구분선 */
    .sidebar-divider { height: 1px; background: #e5e7eb; margin: 0.75rem 1rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar" aria-label="메인 메뉴">
      <div class="sidebar-header">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle">☰</button>
        <h1 class="sidebar-title">CI_R&DM</h1>
      </div>
      <nav class="sidebar-nav"></nav>
    </aside>

    <main class="main-area">
      <div class="container">
        <header class="header" style="display:flex; align-items:center; justify-content:space-between;">
          <h1 class="header-title">💰 프로젝트별 인건비</h1>
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <span style="font-size:0.72rem; color:#94a3b8;">
              <kbd style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:0.2rem;padding:0.1rem 0.3rem;font-size:0.68rem;">Tab</kbd> 다음 셀 &nbsp;
              <kbd style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:0.2rem;padding:0.1rem 0.3rem;font-size:0.68rem;">↑↓</kbd> 상하이동 &nbsp;
              <kbd style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:0.2rem;padding:0.1rem 0.3rem;font-size:0.68rem;">Ctrl+Z</kbd> 되돌리기 &nbsp;
              <kbd style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:0.2rem;padding:0.1rem 0.3rem;font-size:0.68rem;">Esc</kbd> 취소
            </span>
            <span id="pl-save-indicator" style="font-size:0.78rem; color:#059669; opacity:0; transition:opacity 0.3s;"></span>
            <span id="pl-loading" style="font-size:0.78rem; color:#64748b; display:none;">불러오는 중…</span>
          </div>
        </header>

        <!-- 컨트롤바 2행 구조 -->
        <div style="display:flex; flex-direction:column; gap:0.6rem; margin-bottom:1rem;">

          <!-- 1행: 연도 + 분기 + 회사 필터 -->
          <div class="history-toolbar" style="margin-bottom:0;">
            <span class="history-toolbar-label">연도</span>
            <input type="number" id="pl-year-input" value="2025" min="2020" max="2035" step="1" style="font-weight:700; text-align:center;">
            <span class="history-toolbar-label">분기</span>
            <div class="pl-quarter-nav">
              <button type="button" class="pl-quarter-btn" id="pl-quarter-prev">◀</button>
              <span class="pl-quarter-label" id="pl-quarter-label">2분기</span>
              <button type="button" class="pl-quarter-btn" id="pl-quarter-next">▶</button>
            </div>
            <span class="history-toolbar-label" style="margin-left:1rem;">회사</span>
            <div class="company-chips" id="pl-company-chips" role="group" aria-label="회사 필터">
              <button type="button" class="company-chip is-active" data-company="">전체</button>
              <button type="button" class="company-chip" data-company="식스티">식스티</button>
              <button type="button" class="company-chip" data-company="굿뉴스">굿뉴스</button>
              <button type="button" class="company-chip" data-company="패리티">패리티</button>
            </div>
          </div>

          <!-- 2행: 탭과 동일한 CSS grid 3칸으로 정확히 정렬 -->
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.75rem; align-items:center;">

            <!-- 1칸 + 2칸: 과제 선택 (colspan 2) -->
            <div style="grid-column: span 2;">
              <select id="pl-project-select" style="width:100%; padding:0.5rem 0.75rem; border-radius:0.5rem; border:1px solid var(--border-color); background:var(--card-bg); font-size:0.9rem; font-family:inherit;">
                <option value="">-- 과제 선택 --</option>
              </select>
            </div>

            <!-- 3칸: 버튼 3개 균등 배치 -->
            <div style="display:flex; gap:0.4rem;">
              <button type="button" class="ui-btn" id="pl-copy-prev-btn" style="flex:1; justify-content:center; font-size:0.78rem; padding:0.45rem 0.3rem; white-space:nowrap;">📋 이전 분기 복사</button>
              <button type="button" class="ui-btn ui-btn--success" id="pl-calc-all-btn" style="flex:1; justify-content:center; font-size:0.78rem; padding:0.45rem 0.3rem; white-space:nowrap;">⚡ 일괄 자동 계산</button>
              <button type="button" class="ui-btn ui-btn--primary" id="pl-add-person-top-btn" style="flex:1; justify-content:center; font-size:0.78rem; padding:0.45rem 0.3rem; white-space:nowrap;">+ 인력 추가</button>
            </div>

          </div>

        </div>

        <!-- 신규 채용 배너 -->
        <div class="pl-hire-banner" id="pl-hire-banner" style="display:none">
          <span>👥</span>
          <span id="pl-hire-text"></span>
        </div>

        <!-- 탭 -->
        <div class="history-tabs">
          <button type="button" class="history-tab is-active" data-tab="planned">
            <span class="history-tab-icon">📝</span>
            <span class="history-tab-body">
              <span class="history-tab-title">예상 (계획)</span>
              <span class="history-tab-sub">참여율·현금 입력</span>
            </span>
            <span class="history-tab-count" id="tab-count-planned">-</span>
          </button>
          <button type="button" class="history-tab" data-tab="actual">
            <span class="history-tab-icon">✅</span>
            <span class="history-tab-body">
              <span class="history-tab-title">실제 (지급 후)</span>
              <span class="history-tab-sub">실제 지급 내역 입력</span>
            </span>
            <span class="history-tab-count" id="tab-count-actual">-</span>
          </button>
          <button type="button" class="history-tab" data-tab="compare">
            <span class="history-tab-icon">⚖️</span>
            <span class="history-tab-body">
              <span class="history-tab-title">비교</span>
              <span class="history-tab-sub">예상 vs 실제 차이</span>
            </span>
            <span class="history-tab-count" id="tab-count-compare">-</span>
          </button>
        </div>

        <!-- 예상 탭 -->
        <div class="pl-tab-content is-active" id="tab-planned">
          <div class="pl-table-wrap">
            <table class="pl-table" id="pl-table-planned"></table>
          </div>
        </div>

        <!-- 실제 탭 -->
        <div class="pl-tab-content" id="tab-actual">
          <div class="pl-table-wrap">
            <table class="pl-table" id="pl-table-actual"></table>
          </div>
        </div>

        <!-- 비교 탭 -->
        <div class="pl-tab-content" id="tab-compare">
          <div class="pl-compare-options">
            <label class="history-toggle-chip" id="pl-diff-only-chip">
              <input type="checkbox" id="pl-diff-only"> 차이만 보기
            </label>
          </div>
          <div class="pl-table-wrap">
            <table class="pl-table" id="pl-table-compare"></table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- 토스트 알림 -->
  <div id="pl-toast" style="
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(8px);
    background:#059669; color:#fff; padding:0.65rem 1.25rem; border-radius:0.5rem;
    font-size:0.88rem; font-weight:500; display:flex; align-items:center;
    box-shadow:0 4px 16px rgba(0,0,0,0.18); opacity:0;
    transition:opacity 0.25s, transform 0.25s; z-index:2000; white-space:nowrap;
  "></div>

  <!-- 인력 추가 모달 -->
  <div class="pl-modal-overlay" id="pl-add-modal" hidden>
    <div class="pl-modal-panel" role="dialog" aria-modal="true" aria-labelledby="pl-modal-title">
      <div class="pl-modal-header">
        <h2 class="pl-modal-title" id="pl-modal-title">👥 인력 추가</h2>
        <button type="button" class="pl-modal-close" id="pl-modal-close" aria-label="닫기">×</button>
      </div>
      <div class="pl-modal-body">
        <p class="pl-modal-desc">이 과제에 참여할 인력을 검색해서 추가하세요.</p>

        <!-- 검색 -->
        <div class="pl-modal-search-wrap">
          <span class="pl-modal-search-icon">🔍</span>
          <input type="text" id="pl-modal-search" class="pl-modal-search-input"
            placeholder="이름으로 검색..." autocomplete="off">
          <button type="button" class="pl-modal-search-clear" id="pl-modal-search-clear">×</button>
        </div>

        <!-- 이미 추가된 인력 -->
        <div id="pl-modal-added-section" style="margin-bottom:1rem; display:none;">
          <div class="pl-modal-section-title">이미 추가된 인력</div>
          <div id="pl-modal-added-list"></div>
        </div>

        <!-- 검색 결과 -->
        <div class="pl-modal-section-title">전체 인력</div>
        <div id="pl-modal-result-list" class="pl-modal-result-list"></div>

        <div id="pl-modal-empty" class="pl-modal-empty" style="display:none;">
          검색 결과가 없습니다.
        </div>
      </div>
      <div class="pl-modal-footer">
        <button type="button" class="ui-btn" id="pl-modal-cancel">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.example.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase.js"></script>
  <script src="auth-guard.js"></script>
  <script src="firestore-service.js"></script>
  <script src="sidebar.js"></script>
  <script src="project-labor.js"></script>
</body>
</html>

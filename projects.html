<html lang="ko">

  <link rel="stylesheet" href="style.css">
  <style>
    html:not(.auth-bypass) .dashboard { visibility: hidden !important; }
    html.auth-bypass .dashboard { visibility: visible; }
    .auth-overlay {
      position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
      width: 100% !important; height: 100% !important; z-index: 2147483647 !important;
      display: flex !important; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #e0f2fe 100%);
      visibility: visible !important; opacity: 1 !important;
    }
    html.auth-bypass .auth-overlay { display: none !important; }
    .auth-modal { width: 90%; max-width: 400px; background: #fff; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgb(15 23 42 / 0.25); padding: 2rem; text-align: center; }
    .auth-modal-logo { font-size: 1.5rem; font-weight: 700; color: #2563eb; margin-bottom: 0.5rem; }
    .auth-modal-title { font-size: 1rem; color: #64748b; margin-bottom: 1.5rem; }
    .auth-modal input[type="password"] { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; font-size: 1rem; box-sizing: border-box; }
    .auth-modal .auth-submit-btn { width: 100%; margin-top: 1rem; padding: 0.75rem 1rem; background: #2563eb; color: #fff; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .auth-modal .auth-error { margin-top: 0.75rem; font-size: 0.875rem; color: #ef4444; display: none; }
    .auth-modal .auth-error.visible { display: block; }
    body { display: none !important; }
    body.body-ready { display: block !important; }
    .projects-stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .projects-stat-card {
      flex: 1 1 160px;
      min-width: 140px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .projects-stat-label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }
    .projects-stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
    }
    .projects-stat-value.projects-stat--danger { color: var(--danger-color); }
    .projects-stat-value.projects-stat--success { color: var(--success-color); }
    .projects-table-wrap {
      background: var(--card-bg);
      border-radius: 0.75rem;
      box-shadow: var(--shadow-md);
      overflow: auto;
      border: 1px solid var(--border-color);
    }
    .projects-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .projects-table th,
    .projects-table td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }
    .projects-table thead th {
      background: #f5f5f5;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .projects-table tbody tr {
      cursor: default;
      transition: background 0.15s;
    }
    .projects-table tbody tr:hover {
      background: #f8fafc;
    }
    .projects-table .project-edit-btn {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
    }
    .projects-badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 0.35rem; font-size: 0.75rem; font-weight: 600; }
    .projects-badge--rd { background: #dbeafe; color: #1d4ed8; margin-right: 0.25rem; }
    .projects-badge--end { background: #e5e7eb; color: #4b5563; }
    .projects-badge--ongoing { background: #d1fae5; color: #047857; }
    .projects-badge--scheduled { background: #dbeafe; color: #1d4ed8; }
    .projects-badge--waiting { background: #fef3c7; color: #b45309; }
    .projects-badge--unselected { background: #fee2e2; color: #dc2626; }
    .projects-badge--unsubmitted { background: #ddd6fe; color: #5b21b6; }

    /* "수행" 카드 안의 계속/신규 sub-section */
    .ongoing-sub {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid #e5e7eb;
      font-size: 0.85rem;
      color: var(--text-secondary, #6b7280);
    }
    .ongoing-sub-item {
      flex: 1;
      padding: 0.25rem 0.5rem;
      border-radius: 0.35rem;
      transition: background 0.15s;
    }
    .ongoing-sub-item:hover {
      background: #f3f4f6;
    }
    .ongoing-sub-item.active {
      background: #d1fae5;
      color: #047857;
    }
    .ongoing-sub-item strong {
      color: #047857;
      font-size: 1rem;
      margin-left: 0.25rem;
    }
    .ongoing-sub-divider {
      color: #d1d5db;
    }
    .projects-col-toggle {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.75rem;
    }
    .projects-col-dropdown {
      position: relative;
    }
    .projects-col-panel {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      box-shadow: var(--shadow-lg);
      padding: 0.75rem 1rem;
      z-index: 100;
      min-width: 180px;
    }
    .projects-col-panel.open { display: block; }
    .projects-col-panel label { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; cursor: pointer; font-size: 0.875rem; }
    .projects-table .col-opt { display: none; }

    /* 클릭 가능한 통계 카드 */
    .projects-stat-card.clickable {
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }
    .projects-stat-card.clickable:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-color);
    }
    .projects-stat-card.is-active {
      border-color: var(--primary-color);
      border-width: 2px;
      padding: calc(1rem - 1px) calc(1.25rem - 1px);
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.04), rgba(37, 99, 235, 0.09));
    }
    .projects-stat-card.is-active .projects-stat-label {
      color: var(--primary-color);
      font-weight: 600;
    }

    /* 활성 필터 chip */
    .projects-active-filters {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .projects-active-filters:empty { display: none; }
    .projects-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.35rem 0.6rem 0.35rem 0.75rem;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }
    .projects-filter-chip-clear {
      background: rgba(255, 255, 255, 0.7);
      border: none;
      cursor: pointer;
      color: inherit;
      font-size: 0.95rem;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      padding: 0;
      transition: background 0.15s;
    }
    .projects-filter-chip-clear:hover { background: #fff; }

    /* 검색 + 액션 행 (테이블 위) */
    .projects-actions-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .projects-search-input {
      flex: 1;
      min-width: 240px;
      max-width: 480px;
      padding: 0.55rem 0.85rem 0.55rem 2.2rem;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      font-size: 0.9rem;
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-sizing: border-box;
    }
    .projects-search-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .projects-search-wrap {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 480px;
      display: inline-flex;
    }
    .projects-search-icon {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      font-size: 0.95rem;
    }
    .projects-search-clear {
      position: absolute;
      right: 0.4rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0;
      transition: background 0.15s, color 0.15s;
    }
    .projects-search-clear:hover {
      background: #f1f5f9;
      color: var(--text-primary);
    }
    .projects-search-wrap.has-value .projects-search-clear {
      display: inline-flex;
    }
    .projects-actions-spacer { flex: 1; }
    .projects-actions-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* 총 제안 + 분류 카드 (상단 통합) */
    .division-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1rem;
    }
    .division-card-header {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      cursor: pointer;
      user-select: none;
      padding: 0.2rem 0.4rem;
      margin: -0.2rem -0.4rem 0.6rem;
      border-radius: 0.4rem;
      transition: background 0.15s;
      width: fit-content;
    }
    .division-card-header:hover {
      background: #f1f5f9;
    }
    .division-card-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .division-card-value {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--primary-color);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .division-card-unit {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .division-card-divider {
      height: 1px;
      background: var(--border-color);
      margin: 0.5rem 0 0.85rem;
    }
    .division-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .division-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .division-pill:hover {
      background: #fff;
      border-color: var(--primary-color);
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.1);
    }
    .division-pill.is-active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: #fff;
    }
    .division-pill-count {
      color: var(--text-secondary);
      font-weight: 500;
    }
    .division-pill.is-active .division-pill-count {
      color: rgba(255, 255, 255, 0.85);
    }
      /* 사이드바 그룹 구분선 */
    .sidebar-divider {
      height: 1px;
      background: #e5e7eb;
      margin: 0.75rem 1rem;
      opacity: 0.7;
    }
  </style>
</head>

  </script>

        <header class="header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem">

          <div id="project-active-filters" class="projects-active-filters" aria-live="polite"></div>

        <section class="division-card" aria-label="총 제안 + 분류">
          <div class="division-card-header" id="division-clear-trigger" role="button" tabindex="0" title="분류 필터 해제">

            <button type="button" class="division-pill" data-division="지원사업">

            <button type="button" class="division-pill" data-division="용역">

            <button type="button" class="division-pill" data-division="기타">

            </button>
          </div>
        </section>

        <section class="projects-stats-grid" aria-label="성과 대시보드">
          <!-- "수행" 통합 카드 (계속/신규 sub-stats 포함) -->
          <div class="projects-stat-card" id="card-ongoing-all">
            <div class="projects-stat-label">수행</div>
            <div class="projects-stat-value projects-stat--success clickable" data-filter="ongoing" role="button" tabindex="0" id="stat-ongoing-all">0</div>
            <div class="ongoing-sub" id="ongoing-sub" style="display:none;">
              <span class="ongoing-sub-item clickable" data-filter="continue" role="button" tabindex="0">
                계속 <strong id="stat-continue">0</strong>
              </span>
              <span class="ongoing-sub-divider">|</span>
              <span class="ongoing-sub-item clickable" data-filter="new" role="button" tabindex="0">
                신규 <strong id="stat-new">0</strong>
              </span>
            </div>
          </div>
          <div class="projects-stat-card clickable" data-filter="unselected" role="button" tabindex="0">
            <div class="projects-stat-label">미선정</div>

          </div>
          <div class="projects-stat-card">
            <div class="projects-stat-label">당해 지원금 합계</div>

          <div class="projects-stat-card">
            <div class="projects-stat-label">총 지원금 합계</div>

                <th class="col-opt" data-col="연구기간">연구기간</th>
